            FROM {{ ref('DV_STG', 'STAGE_SUPPLIER_TRADERS_NORTH') }} "STAGE_SUPPLIER_TRADERS_NORTH"
            LEFT OUTER JOIN (SELECT s_supplier_mroc_traders_north.hk_h_supplier, MAX(s_supplier_mroc_traders_north.dss_start_date) AS dss_start_date, MAX(s_supplier_mroc_traders_north.dss_version) AS dss_version
