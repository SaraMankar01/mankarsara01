              ON stage_supplier_traders_north.hk_h_supplier = current_rows.hk_h_supplier
            WHERE NOT EXISTS(SELECT 1
            FROM {{ ref('DV_SAT', 'S_SUPPLIER_MROC_TRADERS_NORTH') }} "S_SUPPLIER_MROC_TRADERS_NORTH"
