              ON stage_shipper_traders_north.hk_h_shipper = current_rows.hk_h_shipper
            WHERE NOT EXISTS(SELECT 1
            FROM {{ ref('DV_SAT', 'S_SHIPPER_LROC_TRADERS_NORTH') }} "S_SHIPPER_LROC_TRADERS_NORTH"
