          joinCondition: |-
            FROM {{ ref('DV_STG', 'STAGE_SHIPPER_TRADERS_NORTH') }} "STAGE_SHIPPER_TRADERS_NORTH"
            LEFT OUTER JOIN (SELECT s_shipper_lroc_traders_north.hk_h_shipper, MAX(s_shipper_lroc_traders_north.dss_start_date) AS dss_start_date, MAX(s_shipper_lroc_traders_north.dss_version) AS dss_version
