          joinCondition: |-
            FROM {{ ref('DV_STG', 'STAGE_REGION_TRADERS_NORTH') }} "STAGE_REGION_TRADERS_NORTH"
            LEFT OUTER JOIN (SELECT s_region_lroc_traders_north.hk_h_region, MAX(s_region_lroc_traders_north.dss_start_date) AS dss_start_date, MAX(s_region_lroc_traders_north.dss_version) AS dss_version
