        join:
          joinCondition: |-
            FROM {{ ref('DV_STG', 'STAGE_SUPPLIER_TRADERS_SOUTH') }} "STAGE_SUPPLIER_TRADERS_SOUTH"
            LEFT OUTER JOIN (SELECT s_supplier_lroc_traders_south.hk_h_supplier, MAX(s_supplier_lroc_traders_south.dss_start_date) AS dss_start_date, MAX(s_supplier_lroc_traders_south.dss_version) AS dss_version
