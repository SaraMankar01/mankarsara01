            LEFT OUTER JOIN (SELECT s_product_lroc_traders_north.hk_h_product, MAX(s_product_lroc_traders_north.dss_start_date) AS dss_start_date, MAX(s_product_lroc_traders_north.dss_version) AS dss_version
