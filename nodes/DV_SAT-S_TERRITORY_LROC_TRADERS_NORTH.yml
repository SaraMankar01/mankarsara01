        join:
          joinCondition: |-
            FROM {{ ref('DV_STG', 'STAGE_TERRITORY_TRADERS_NORTH') }} "STAGE_TERRITORY_TRADERS_NORTH"
            LEFT OUTER JOIN (SELECT s_territory_lroc_traders_north.hk_h_territory, MAX(s_territory_lroc_traders_north.dss_start_date) AS dss_start_date, MAX(s_territory_lroc_traders_north.dss_version) AS dss_version
            FROM {{ ref('DV_SAT', 'S_TERRITORY_LROC_TRADERS_NORTH') }} "S_TERRITORY_LROC_TRADERS_NORTH"
            GROUP BY s_territory_lroc_traders_north.hk_h_territory) AS current_rows
              ON stage_territory_traders_north.hk_h_territory = current_rows.hk_h_territory
            WHERE NOT EXISTS(SELECT 1
            FROM {{ ref('DV_SAT', 'S_TERRITORY_LROC_TRADERS_NORTH') }} "S_TERRITORY_LROC_TRADERS_NORTH"
            WHERE stage_territory_traders_north.hk_h_territory = s_territory_lroc_traders_north.hk_h_territory
                AND stage_territory_traders_north.dss_change_hash_territory_lroc_traders_north = s_territory_lroc_traders_north.dss_change_hash
                AND current_rows.dss_start_date = s_territory_lroc_traders_north.dss_start_date)
